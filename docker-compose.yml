name: tilawah

services:
  api:
    build:
      context: ./server
    container_name: tilawah-api
    ports:
      - "8010:8000"          # local dev; on the VPS, Caddy is the public entry
    environment:
      MODEL_ID: ${MODEL_ID:-tarteel-ai/whisper-base-ar-quran}
      DEVICE: ${DEVICE:--1}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://tilawah:${POSTGRES_PASSWORD:-tilawah}@db:5432/tilawah
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    volumes:
      # Cache the downloaded model so it survives container restarts/reboots.
      - tilawah-models:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: tilawah-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tilawah-redis
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: tilawah-db
    environment:
      POSTGRES_USER: tilawah
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tilawah}
      POSTGRES_DB: tilawah
    volumes:
      - tilawah-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tilawah -d tilawah"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  tilawah-models:
  tilawah-db:
  caddy-data:
  caddy-config:
